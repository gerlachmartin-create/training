<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainings-Sicherung</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--border:#e1e4e8;--text:#1a1a1a;--muted:#6a737d;--blue:#3498db;--green:#27ae60;}
  *{box-sizing:border-box;}
  body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}
  h1{font-size:20px;margin:0 0 4px;}
  p.sub{margin:0 0 16px;color:var(--muted);font-size:13px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;}
  .count{font-size:14px;font-weight:600;margin-bottom:10px;}
  textarea{width:100%;height:140px;font-size:11px;font-family:ui-monospace,monospace;border:1px solid var(--border);border-radius:8px;padding:10px;resize:vertical;}
  button{width:100%;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;color:#fff;margin-top:10px;cursor:pointer;}
  .btn-copy{background:var(--blue);}
  .btn-dl{background:var(--green);}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .empty{color:var(--muted);font-size:14px;}
  details{margin-top:8px;}
  summary{cursor:pointer;font-size:13px;color:var(--muted);}
</style>
</head>
<body>
  <h1>🔒 Trainings-Sicherung</h1>
  <p class="sub">Diese Seite liest deine gespeicherten Daten nur aus — sie verändert oder löscht nichts.</p>

  <div class="card">
    <div class="count" id="count">Lade…</div>
    <textarea id="json" readonly></textarea>
    <button class="btn-copy" onclick="copyJson()">📋 Daten kopieren</button>
    <button class="btn-dl" onclick="downloadJson()">💾 Als Datei sichern</button>
  </div>

  <div class="card">
    <div class="count">📊 Übersicht</div>
    <div id="readable"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  // Alle Schlüssel einsammeln (read-only)
  var data={};
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      data[k]=localStorage.getItem(k);
    }
  }catch(e){}

  var keys=Object.keys(data);
  var tpKeys=keys.filter(function(k){return k.indexOf('tp_')===0;});
  var json=JSON.stringify(data,null,0);
  document.getElementById('json').value=json;
  document.getElementById('count').textContent='✅ '+keys.length+' Einträge gefunden ('+tpKeys.length+' Trainings-Einträge)';

  // Lesbare Übersicht der Sätze: tp_v3_<tag>_<übung>_s<satz>_(kg|reps)
  var sets={};
  tpKeys.forEach(function(k){
    var m=k.match(/^tp_v3_(.+)_s(\d+)_(kg|reps)$/);
    if(m){
      var id=m[1]+'__s'+m[2];
      sets[id]=sets[id]||{ex:m[1],set:parseInt(m[2])+1};
      sets[id][m[3]]=data[k];
    }
  });
  var rows=Object.keys(sets).map(function(id){return sets[id];})
    .filter(function(r){return (r.kg&&r.kg!=='')||(r.reps&&r.reps!=='');})
    .sort(function(a,b){return a.ex<b.ex?-1:a.ex>b.ex?1:a.set-b.set;});

  var rd=document.getElementById('readable');
  if(!rows.length){
    rd.innerHTML='<div class="empty">Noch keine Gewichte/Wiederholungen erfasst. Falls du sicher Daten eingegeben hast, kopiere oben trotzdem die Daten und schicke sie — die Rohdaten enthalten alles.</div>';
  } else {
    var html='<table><tr><th>Übung / Tag</th><th>Satz</th><th>kg</th><th>Wdh</th></tr>';
    rows.forEach(function(r){
      html+='<tr><td>'+r.ex+'</td><td>'+r.set+'</td><td>'+(r.kg||'–')+'</td><td>'+(r.reps||'–')+'</td></tr>';
    });
    html+='</table>';
    rd.innerHTML=html;
  }

  // Buttons
  window.copyJson=function(){
    var t=document.getElementById('json');
    t.focus();t.select();
    var done=function(){toast('✓ Kopiert! Jetzt in den Chat einfügen.');};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t.value).then(done,function(){try{document.execCommand('copy');done();}catch(e){toast('Bitte Text manuell markieren & kopieren');}});
    } else {
      try{document.execCommand('copy');done();}catch(e){toast('Bitte Text manuell markieren & kopieren');}
    }
  };
  window.downloadJson=function(){
    try{
      var blob=new Blob([json],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      var d=new Date().toISOString().slice(0,10);
      a.href=url;a.download='training-backup-'+d+'.json';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
      toast('💾 Datei gespeichert');
    }catch(e){toast('Download nicht möglich – bitte kopieren');}
  };
  function toast(msg){
    var t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},2500);
  }
})();
</script>
</body>
</html>
