<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Trainingsplan Ppl",
  "schemaVersion": 1,
  "description": "Interaktive Trainingsplan-App mit Aufwärm-Karte, Studio-Maschinen (B01/E01 etc.), Workout-Picker, Pausentimer, Fortschrittsanzeige und Trainingsreport."
}
</script>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trainingsplan</title>
<style>
  :root {
    color-scheme: light;
    --push:#c0392b; --pull:#1e8449; --legs:#7d3c98; --rest:#7f8c8d;
    --bg:#f4f5f7; --card:#fff; --border:#e0e0e0; --text:#1a1a2e; --muted:#666;
    --radius:12px; --shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

  .topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
  .topbar-title{font-size:18px;font-weight:700;}
  .topbar-date{font-size:12px;color:var(--muted);margin-top:1px;}
  .topbar-right{display:flex;gap:8px;}
  .btn-icon{background:var(--bg);border:none;border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer;}

  .day-tabs{display:flex;overflow-x:auto;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--border);scrollbar-width:none;}
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{flex-shrink:0;padding:6px 10px;border-radius:20px;border:2px solid transparent;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;}
  .day-tab .tab-label{font-size:12px;}
  .day-tab .tab-sub{font-size:9px;opacity:0.8;}
  .day-tab.active{color:#fff;border-color:transparent;}
  .day-tab:not(.active){background:#fff;}

  .content{padding:12px;padding-bottom:80px;max-width:520px;margin:0 auto;}

  .day-header{border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;color:#fff;display:flex;align-items:center;justify-content:space-between;}
  .day-header h2{font-size:16px;font-weight:700;}
  .day-header p{font-size:12px;opacity:0.85;margin-top:2px;}
  .day-header-left{flex:1;}
  .progress-ring{position:relative;width:52px;height:52px;flex-shrink:0;}
  .progress-ring svg{transform:rotate(-90deg);}
  .progress-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}

  .superset-divider{display:flex;align-items:center;gap:8px;margin:-4px 0;}
  .superset-divider span{font-size:10px;font-weight:700;color:#fff;background:#27ae60;padding:2px 8px;border-radius:10px;white-space:nowrap;}
  .superset-divider::before,.superset-divider::after{content:'';flex:1;height:1px;background:#27ae60;opacity:0.4;}

  .floor-divider{display:flex;align-items:center;gap:8px;margin:6px 0 2px;}
  .floor-divider span{font-size:10px;font-weight:700;color:#fff;padding:3px 10px;border-radius:10px;white-space:nowrap;}
  .floor-divider::before,.floor-divider::after{content:'';flex:1;height:1px;opacity:0.45;}
  .floor-divider.floor-up span{background:#d35400;}
  .floor-divider.floor-up::before,.floor-divider.floor-up::after{background:#d35400;}
  .floor-divider.floor-down span{background:#5d6d7e;}
  .floor-divider.floor-down::before,.floor-divider.floor-down::after{background:#5d6d7e;}

  .ex-card{background:var(--card);border-radius:var(--radius);margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;}
  .ex-card.superset{border-left:3px solid #27ae60;}
  .ex-card.done-all{border-color:#27ae60;background:#f0fff4;}
  .ex-card.skipped{border-color:#bbb;background:#f8f8f8;opacity:0.7;}

  .ex-header{display:flex;align-items:center;gap:10px;padding:12px 14px;}
  .ex-nr{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
  .ex-card.skipped .ex-nr{background:#bbb!important;}
  .ex-info{flex:1;min-width:0;cursor:pointer;}
  .ex-name{font-size:14px;font-weight:600;line-height:1.2;}
  .ex-card.skipped .ex-name{text-decoration:line-through;color:var(--muted);}
  .ex-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .ex-status{font-size:18px;flex-shrink:0;}
  .ex-chevron{font-size:12px;color:var(--muted);flex-shrink:0;transition:transform 0.2s;cursor:pointer;}
  .ex-card.open .ex-chevron{transform:rotate(180deg);}

  .skip-ex-btn{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;border:1px solid;cursor:pointer;flex-shrink:0;white-space:nowrap;}
  .skip-ex-btn.active{background:#f0f0f0;color:#999;border-color:#ccc;}
  .skip-ex-btn.inactive{background:#fff3f3;color:#c0392b;border-color:#e8b4b4;}
  .skipped-label{font-size:11px;color:#999;font-style:italic;padding:6px 14px 10px;}

  .ex-sets{padding:0 14px 12px;display:none;}
  .ex-card.open .ex-sets{display:block;}
  .sets-header{display:grid;grid-template-columns:36px 1fr 1fr 36px;gap:6px;font-size:10px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px;text-transform:uppercase;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .set-row{display:grid;grid-template-columns:36px 1fr 1fr 36px;gap:6px;align-items:center;margin-bottom:6px;}
  .set-nr{width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);margin:0 auto;}
  .set-input{border:1.5px solid var(--border);border-radius:8px;padding:6px 8px;font-size:14px;font-weight:600;text-align:center;width:100%;color:var(--text);background:#fff;-webkit-appearance:none;}
  .set-input:focus{outline:none;border-color:#3498db;}
  .set-input::placeholder{color:#ccc;font-weight:400;}
  .set-done-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.15s;margin:0 auto;}
  .set-done-btn.done{background:#27ae60;border-color:#27ae60;}
  .set-row.done .set-nr{background:#e8f8f0;color:#27ae60;}
  .set-row.done .set-input{background:#f0fff4;border-color:#a8e6c0;color:#1e8449;}
  .notes-text{font-size:11px;color:#e67e22;background:#fef9f0;border-radius:6px;padding:5px 8px;margin-top:4px;}
  .ex-desc{font-size:12px;color:#444;background:#f8f9fa;border-radius:6px;padding:8px 10px;margin-top:6px;line-height:1.5;}
  .ex-video-btn{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:7px 12px;background:#ff0000;color:#fff;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none;}

  /* ── WARM-UP ── */
  .warmup-card{background:#fff;border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);border:2px solid #2980b9;overflow:hidden;}
  .warmup-card.done-wu{border-color:#27ae60;}
  .warmup-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .warmup-icon{font-size:20px;flex-shrink:0;}
  .warmup-title{font-size:14px;font-weight:700;color:#2980b9;flex:1;}
  .warmup-card.done-wu .warmup-title{color:#27ae60;}
  .warmup-badge{font-size:12px;font-weight:700;background:#ebf5fb;color:#2980b9;padding:3px 8px;border-radius:8px;flex-shrink:0;}
  .warmup-card.done-wu .warmup-badge{background:#e8f8f0;color:#27ae60;}
  .warmup-chev{font-size:11px;color:var(--muted);transition:transform 0.2s;flex-shrink:0;}
  .warmup-card.wu-open .warmup-chev{transform:rotate(180deg);}
  .warmup-body{display:none;padding:0 14px 12px;}
  .warmup-card.wu-open .warmup-body{display:block;}

  /* ── KCAL ── */
  .kcal-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.2);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;color:#fff;margin-top:4px;}
  .bw-hint{background:#ebf5fb;border:1px solid #aed6f1;border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .bw-hint span{font-size:12px;color:#2980b9;font-weight:600;}
  .bw-hint button{background:#2980b9;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}
  .bw-input-row{display:flex;gap:8px;margin-top:10px;}
  .bw-input{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;text-align:center;}

  /* ── TIMER ── */
  .rest-timer-bar{display:none;background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:8px;align-items:center;gap:10px;}
  .rest-timer-bar.active{display:flex;}
  .timer-display{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:48px;}
  .timer-label{font-size:11px;color:var(--muted);flex:1;}
  .timer-stop{background:#e74c3c;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;}
  .timer-progress{height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden;}
  .timer-progress-fill{height:100%;border-radius:2px;background:#3498db;transition:width 1s linear;}

  /* ── WORKOUT PICKER ── */
  .rec-card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:2px solid #3498db;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform 0.1s;}
  .rec-card:active{transform:scale(0.98);}
  .rec-icon{font-size:28px;flex-shrink:0;}
  .rec-body{flex:1;}
  .rec-title{font-size:16px;font-weight:700;}
  .rec-reason{font-size:12px;color:var(--muted);margin-top:3px;}
  .rec-arrow{font-size:22px;font-weight:700;flex-shrink:0;}
  .picker-heading{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px;}
  .picker-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:8px;box-shadow:var(--shadow);border:1.5px solid var(--border);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform 0.1s;}
  .picker-card:active{transform:scale(0.98);}
  .picker-card.recommended{border-width:2px;}
  .picker-dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .picker-info{flex:1;}
  .picker-name{font-size:14px;font-weight:700;}
  .picker-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .picker-badge{font-size:12px;font-weight:700;flex-shrink:0;margin-right:4px;}
  .picker-arr{font-size:18px;color:var(--muted);flex-shrink:0;}

  .week-overview{display:none;}
  .week-overview.active{display:block;}
  .week-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;cursor:pointer;border:1px solid var(--border);transition:transform 0.1s;}
  .week-card:active{transform:scale(0.98);}
  .week-card-dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .week-card-info{flex:1;}
  .week-card-info h3{font-size:15px;font-weight:700;}
  .week-card-info p{font-size:12px;color:var(--muted);margin-top:2px;}
  .week-card-badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;}

  .fab{position:fixed;bottom:20px;right:16px;z-index:200;width:50px;height:50px;border-radius:50%;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:center;transition:transform 0.15s;}
  .fab:active{transform:scale(0.92);}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;align-items:flex-end;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;max-height:70vh;overflow-y:auto;}
  .modal h3{font-size:16px;font-weight:700;margin-bottom:14px;}
  .modal-btn{width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:8px;}
  .modal-btn.danger{background:#fdecea;color:#c0392b;}
  .modal-btn.warning{background:#fff3cd;color:#856404;}
  .modal-btn.success{background:#e8f8f0;color:#1e8449;}
  .modal-btn.primary{background:#ebf5fb;color:#2980b9;}
  .modal-btn.neutral{background:var(--bg);color:var(--text);}
  .modal-btn.cancel{background:transparent;color:var(--muted);}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#2c3e50;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:400;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ── REPORT ── */
  .report-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:500;overflow-y:auto;padding-bottom:80px;}
  .report-overlay.open{display:block;}
  .report-topbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:10;box-shadow:var(--shadow);}
  .report-topbar h2{font-size:18px;font-weight:700;flex:1;}
  .report-close{background:var(--bg);border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .report-section{background:#fff;border-radius:var(--radius);margin:12px;padding:16px;box-shadow:var(--shadow);}
  .report-section h3{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:14px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-box{background:var(--bg);border-radius:10px;padding:14px 10px;text-align:center;}
  .stat-box .stat-val{font-size:30px;font-weight:800;line-height:1;}
  .stat-box .stat-lbl{font-size:11px;color:var(--muted);margin-top:4px;}
  .week-chart-wrap{display:flex;align-items:flex-end;gap:3px;height:90px;margin-bottom:8px;}
  .wk-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;}
  .wk-bars{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;}
  .wk-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px;}
  .wk-lbl{font-size:9px;color:var(--muted);margin-top:3px;text-align:center;}
  .chart-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}
  .chart-legend span{font-size:11px;}
  .muscle-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .muscle-label{font-size:12px;font-weight:600;width:55px;flex-shrink:0;}
  .muscle-bar-bg{flex:1;height:14px;background:var(--bg);border-radius:7px;overflow:hidden;}
  .muscle-bar-fill{height:100%;border-radius:7px;}
  .muscle-count{font-size:11px;color:var(--muted);width:32px;text-align:right;flex-shrink:0;}
  .ex-select{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text);margin-bottom:12px;}
  .prog-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .prog-table th{font-size:10px;font-weight:700;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);text-transform:uppercase;}
  .prog-table td{font-size:13px;padding:7px 6px;border-bottom:1px solid #f0f0f0;}
  .prog-table tr:last-child td{border-bottom:none;}
  .session-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f5f5f5;}
  .session-item:last-child{border-bottom:none;}
  .session-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .session-info .si-name{font-size:13px;font-weight:700;}
  .session-info .si-date{font-size:11px;color:var(--muted);margin-top:1px;}
  .no-data-hint{text-align:center;padding:24px 16px;color:var(--muted);}
  .no-data-hint .nd-icon{font-size:36px;margin-bottom:10px;}
  .no-data-hint p{font-size:13px;line-height:1.5;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">💪 Trainingsplan</div>
    <div class="topbar-date" id="topbarDate"></div>
  </div>
  <div class="topbar-right">
    <button class="btn-icon" onclick="showReport()">📊</button>
    <button class="btn-icon" onclick="showOverview()">📋</button>
    <button class="btn-icon" onclick="showOptions()">⚙️</button>
  </div>
</div>
<div class="day-tabs" id="dayTabs"></div>
<div class="content" id="content"></div>
<button class="fab" id="fab" onclick="fabAction()" style="background:#3498db;color:#fff;">✓</button>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal"><h3 id="modalTitle"></h3><div id="modalBody"></div></div>
</div>
<div class="toast" id="toast"></div>

<div id="timerBar" class="rest-timer-bar">
  <div style="flex:1">
    <div class="timer-display" id="timerDisplay">0:00</div>
    <div class="timer-label">⏱ Pause läuft…</div>
    <div class="timer-progress"><div class="timer-progress-fill" id="timerFill" style="width:100%"></div></div>
  </div>
  <button class="timer-stop" onclick="stopTimer()">Stop</button>
</div>

<div class="report-overlay" id="reportOverlay">
  <div class="report-topbar">
    <h2>📊 Trainingsreport</h2>
    <button class="report-close" onclick="hideReport()">✕ Schließen</button>
  </div>
  <div id="reportContent"></div>
</div>

<script>
// ─── PLAN DATA ───────────────────────────────────────────────
const PLAN = [
  { key:'pushA', title:'PUSH A', subtitle:'Brust & Trizeps', type:'push', emoji:'🔴',
    exercises:[
      {id:'pA1', name:'Brustpresse (Maschine)',           sets:4,reps:'10–12',rest:90, notes:'letztes steigern'},
      {id:'pA2', name:'Butterfly / Pec Deck (A02)',       sets:4,reps:'12–15',rest:75, notes:'Brust am Endpunkt zusammenkneifen'},
      {id:'pA4', name:'Seitheben (Maschine)',             sets:4,reps:'15–20',rest:60, notes:'4 Sek. absenken'},
      {id:'pA7', name:'Butterfly Reverse',                sets:3,reps:'15–20',rest:60, notes:'hintere Schulter'},
      {id:'pA5', name:'Trizepsmaschine',                  sets:4,reps:'12–15',rest:60, notes:'Ellbogen fixiert'},
      {id:'pA3', name:'Brustpresse liegend (KH)',         sets:3,reps:'12–15',rest:75, notes:'2×12,5 kg', floorUp:true},
      {id:'pA6', name:'Kabel Trizeps-Pushdown (Seil)',   sets:3,reps:'12–15',rest:60},
      {id:'pA8', name:'Kabel Overhead Extension',        sets:3,reps:'12–15',rest:60, notes:'langer Trizepskopf'},
    ]},
  { key:'pullA', title:'PULL A', subtitle:'Rücken & Bizeps', type:'pull', emoji:'🟢',
    exercises:[
      {id:'plA7', name:'Klimmzüge mit Unterstützung (B04)', sets:4,reps:'8–12', rest:90, notes:'volle Streckung unten'},
      {id:'plA1', name:'Latzug (B02)',                    sets:4,reps:'10–12',rest:75, notes:'Schulterblätter zusammenziehen'},
      {id:'plA2', name:'Ruderzugmaschine (B01)',           sets:4,reps:'10–12',rest:75, notes:'letztes steigern'},
      {id:'plA3', name:'Seitenrunterdrücken (Maschine)',  sets:4,reps:'12–15',rest:60},
      {id:'plA4', name:'Überzugmaschine (B21)',           sets:3,reps:'12–15',rest:60},
      {id:'plA8', name:'Butterfly Reverse',               sets:3,reps:'15–20',rest:60, notes:'hintere Schulter'},
      {id:'plA5', name:'Bizepsmaschine',                  sets:4,reps:'10–12',rest:60, notes:'letzter Satz: bis Versagen'},
      {id:'plA6', name:'Kabel-Bizeps-Curls',             sets:3,reps:'12–15',rest:60, notes:'volle Kontraktion', floorUp:true},
    ]},
  { key:'legsA', title:'BEINE A', subtitle:'Quadrizeps-Fokus', type:'legs', emoji:'🟣',
    exercises:[
      {id:'lA2', name:'Kniebeugen (Langhantel)',          sets:3,reps:'10–12',rest:90, notes:'2×15 kg, volle Tiefe'},

// ─── HELPERS ─────────────────────────────────────────────────
function getTodayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function sk(dk,ei,si,f){ return SK+dk+'_'+ei+'_s'+si+'_'+f; }
function saveSet(dk,ei,si,f,v){ try{localStorage.setItem(sk(dk,ei,si,f),v);}catch(e){} }
function loadSet(dk,ei,si,f){ try{return localStorage.getItem(sk(dk,ei,si,f))||'';}catch(e){return '';} }
function isDone(dk,ei,si){ try{return localStorage.getItem(sk(dk,ei,si,'done'))==='1';}catch(e){return false;} }
function isExSkipped(dk,ei){ try{return localStorage.getItem(SK+dk+'_'+ei+'_skip')==='1';}catch(e){return false;} }
function setExSkipped(dk,ei,v){ try{localStorage.setItem(SK+dk+'_'+ei+'_skip',v?'1':'0');}catch(e){} }
function getBodyWeight(){ try{return parseFloat(localStorage.getItem('tp_bodyweight')||'0');}catch(e){return 0;} }
function setBodyWeight(kg){ try{localStorage.setItem('tp_bodyweight',kg);}catch(e){} }

// ─── WORKOUT HISTORY & RECOMMENDATION ────────────────────────
function getWorkoutLog(){
  try{
    return Object.keys(localStorage)
      .filter(k=>k.startsWith('tp_done_'))
      .map(k=>({date:k.replace('tp_done_',''),key:localStorage.getItem(k)}))
      .filter(e=>PLAN.some(p=>p.key===e.key&&p.type!=='rest'))
      .sort((a,b)=>b.date.localeCompare(a.date));
  }catch(e){return [];}
}
function getLastDoneDate(workoutKey){
  const e=getWorkoutLog().find(e=>e.key===workoutKey);
  return e?e.date:null;
}
function daysSince(dateStr){
  if(!dateStr) return 999;
  const d=new Date(dateStr+'T12:00:00');
  const t=new Date(getTodayStr()+'T12:00:00');
  return Math.round((t-d)/86400000);
}
function getRecommendation(){
  const today=getTodayStr();
  const todayKey=localStorage.getItem('tp_done_'+today);
  if(todayKey&&PLAN.some(p=>p.key===todayKey))
    return {key:todayKey,reason:'Heute bereits gestartet ✓',isActive:true};
  const log=getWorkoutLog();
  if(!log.length) return {key:'pushA',reason:'Noch kein Eintrag – starte mit Push A'};
  const rotation={pushA:'pullA',pullA:'legsA',legsA:'pushB',pushB:'pullB',pullB:'legsB',legsB:'pushA'};
  const last=log[0];
  const nextKey=rotation[last.key];
  const lastPlan=PLAN.find(p=>p.key===last.key);
  const ds=daysSince(last.date);
  if(nextKey){
    const nextPlan=PLAN.find(p=>p.key===nextKey);
    const dayLabel=ds===0?'heute':ds===1?'gestern':`vor ${ds} Tagen`;
    return {key:nextKey,reason:`Nach ${lastPlan?.title} (${dayLabel}) → ${nextPlan?.title}`};
  }
  return {key:'pushA',reason:'Weiter geht\'s!'};
}
function getWorkoutProgress(workoutKey){
  const day=PLAN.find(p=>p.key===workoutKey);
  if(!day||!day.exercises.length) return {done:0,total:0};
  let done=0,total=0;
  day.exercises.forEach(ex=>{
    if(isExSkipped(workoutKey,ex.id)){done++;total++;return;}
    for(let s=0;s<ex.sets;s++){total++;if(isDone(workoutKey,ex.id,s))done++;}
  });
  return {done,total};
}
function selectWorkout(key){
  const w=PLAN.find(p=>p.key===key);
  if(w&&w.type!=='rest'){
    const {done,total}=getWorkoutProgress(key);
    if(total>0&&done===total){
      activeWorkoutKey=key;viewMode='day';openEx.clear();render();window.scrollTo(0,0);
      document.getElementById('modalTitle').textContent='🔁 Nochmal trainieren?';
      document.getElementById('modalBody').innerHTML=`
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px">${w.emoji} <strong>${w.title}</strong> ist bereits abgeschlossen.</p>
        <button class="modal-btn success" onclick="resetDoneOnly('${key}')">✓ Ja, nochmal machen</button>
        <button class="modal-btn neutral" onclick="closeModal()">Nein, so lassen</button>`;
      document.getElementById('modalOverlay').classList.add('open');
      return;
    }
  }
  activeWorkoutKey=key;viewMode='day';openEx.clear();render();window.scrollTo(0,0);
}
function resetDoneOnly(key){
  closeModal();
  const w=PLAN.find(p=>p.key===key);if(!w)return;
  w.exercises.forEach(ex=>{
    for(let s=0;s<ex.sets;s++) try{localStorage.removeItem(sk(w.key,ex.id,s,'done'));}catch(e){}
    try{localStorage.removeItem(SK+w.key+'_'+ex.id+'_skip');}catch(e){}
  });
  try{localStorage.removeItem('tp_done_'+getTodayStr());}catch(e){}
  openEx.clear();render();showToast('Häkchen zurückgesetzt – viel Erfolg! 💪');
}
function goBackToPicker(){ activeWorkoutKey=null;render();window.scrollTo(0,0); }

// ─── HISTORY ─────────────────────────────────────────────────
const NAME_TO_IDS={};
PLAN.forEach(w=>w.exercises.forEach(ex=>{
  if(!NAME_TO_IDS[ex.name]) NAME_TO_IDS[ex.name]=[];
  NAME_TO_IDS[ex.name].push({dk:w.key,eid:ex.id});
}));

function getLastHistByName(exName,si,field){
  try{
    const pairs=NAME_TO_IDS[exName]||[];
    let bestDate='',bestVal='';
    for(const k of Object.keys(localStorage)){
      if(!k.startsWith('tp_hist_')||!k.endsWith('_'+field))continue;
      const rest=k.slice('tp_hist_'.length);
      const dateEnd=rest.indexOf('_');
      const date=rest.slice(0,dateEnd);
      const remainder=rest.slice(dateEnd+1,rest.length-field.length-1);
      const lastUnder=remainder.lastIndexOf('_');
      const setIdx=parseInt(remainder.slice(lastUnder+1));
      const dkEid=remainder.slice(0,lastUnder);
      const firstUnder=dkEid.indexOf('_');
      const dk=dkEid.slice(0,firstUnder);
      const eid=dkEid.slice(firstUnder+1);
      if(setIdx!==si)continue;
      if(!pairs.some(p=>p.dk===dk&&p.eid===eid))continue;
      if(date>bestDate){bestDate=date;bestVal=localStorage.getItem(k)||'';}
    }
    return bestVal;
  }catch(e){return '';}
}
function loadSetWithFallback(dk,ei,exName,si,field){
  return loadSet(dk,ei,si,field)||getLastHistByName(exName,si,field);
}
function saveSetToHistory(dk,ei,si,kg,reps){
  try{
    const d=getTodayStr();
    const base='tp_hist_'+d+'_'+dk+'_'+ei+'_'+si;
    if(kg) localStorage.setItem(base+'_kg',kg);
    if(reps) localStorage.setItem(base+'_reps',reps);
  }catch(e){}
}
function saveSessionDone(dayKey){
  try{
    // Trainingstag immer auf die zuletzt trainierte Einheit setzen,
    // damit die Datumsanzeige stimmt (auch ohne 100 % abgehakt).
    localStorage.setItem('tp_done_'+getTodayStr(),dayKey);
  }catch(e){}
}
// Zentral: Sobald es irgendeinen Fortschritt gibt (Satz abgehakt ODER
// Übung übersprungen), den heutigen Trainingstag festhalten.
// Nur schreibend – ein einmal registriertes Training wird NICHT mehr
// automatisch entfernt, damit ein absolvierter Trainingstag nie verloren
// geht (das war die Ursache für "Training nicht gemerkt / vor X Tagen").
// Ein bewusstes Zurücksetzen entfernt den Eintrag weiterhin gezielt.
function syncSessionRecord(dayKey){
  try{
    const {done}=getWorkoutProgress(dayKey);
    if(done>0) localStorage.setItem('tp_done_'+getTodayStr(),dayKey);
  }catch(e){}
}
// Ein einziger, verlässlicher Re-Render nach jeder Interaktion – ersetzt das
// fehleranfällige Einzel-DOM-Patchen, das dazu führte, dass Änderungen erst
// nach einem Tab-Wechsel sichtbar wurden.
function refresh(){
  try{ renderTabs(); }catch(e){}
  try{ renderContent(); }catch(e){}
  try{ updateFab(); }catch(e){}
  try{ placeTimerBar(); }catch(e){}
}

// ─── CALORIE & SESSION ────────────────────────────────────────
function maybeStartSession(dayKey){
  try{
    const k='tp_sess_start_'+getTodayStr()+'_'+dayKey;
    if(!localStorage.getItem(k)) localStorage.setItem(k,Date.now().toString());
  }catch(e){}
}
function calcKcal(type,dayKey){
  try{
    const bw=getBodyWeight();if(!bw)return 0;
    const start=localStorage.getItem('tp_sess_start_'+getTodayStr()+'_'+dayKey);
    if(!start)return 0;
    const durH=Math.min((Date.now()-parseInt(start))/3600000,2.5);
    return Math.round((MET[type]||4.0)*bw*durH);
  }catch(e){return 0;}
}
function getKcal(date){ try{return parseInt(localStorage.getItem('tp_kcal_'+date)||'0');}catch(e){return 0;} }

// ─── AUFWÄRMEN ────────────────────────────────────────────────
function getWuChoice(dk){ try{return localStorage.getItem('tp_wu_'+getTodayStr()+'_'+dk)||'';}catch(e){return '';} }
function setWuChoice(dk,id){

    localStorage.setItem('tp_wu_'+getTodayStr()+'_'+dk,cur===id?'':id);

      ${WARMUP_MACHINES.map(m=>`

          <span style="font-size:22px">${m.emoji}</span>
          <span>${m.label}</span>
        </button>`).join('')}
    </div>
    ${done?`<p style="font-size:11px;color:#27ae60;margin-top:8px;text-align:center">✓ ${WARMUP_MACHINES.find(m=>m.id===chosen)?.label} erledigt — viel Erfolg!</p>`:''}`;

// ─── RENDER ──────────────────────────────────────────────────
function render(){ renderTabs();renderContent();updateFab(); }

function renderTabs(){
  const tabs=document.getElementById('dayTabs');
  tabs.innerHTML='';
  PLAN.filter(p=>p.type!=='rest').forEach(w=>{
    const isActive=activeWorkoutKey===w.key&&viewMode!=='overview';
    const color=TYPE_COLORS[w.type];
    const {done,total}=getWorkoutProgress(w.key);
    const pct=total>0?Math.round(done/total*100):0;
    const ds=daysSince(getLastDoneDate(w.key));
    const badge=pct===100?'✓':pct>0?pct+'%':ds<999?ds+'d':'';
    const tab=document.createElement('button');
    tab.className='day-tab'+(isActive?' active':'');
    tab.style.color=isActive?'#fff':color;
    tab.style.borderColor=isActive?'transparent':color;
    if(isActive) tab.style.background=color;
    tab.innerHTML=`<span class="tab-label">${w.emoji}</span><span class="tab-sub">${badge||w.title.split(' ')[1]}</span>`;
    tab.onclick=()=>selectWorkout(w.key);
    tabs.appendChild(tab);
  });
  const ov=document.createElement('button');
  ov.className='day-tab'+(viewMode==='overview'?' active':'');
  ov.style.color=viewMode==='overview'?'#fff':'#3498db';
  ov.style.borderColor=viewMode==='overview'?'transparent':'#3498db';
  if(viewMode==='overview') ov.style.background='#3498db';
  ov.innerHTML='<span class="tab-label">📋</span><span class="tab-sub">Plan</span>';
  ov.onclick=showOverview;
  tabs.appendChild(ov);
}

function renderContent(){
  const el=document.getElementById('content');
  if(viewMode==='overview'){renderOverview(el);return;}
  if(!activeWorkoutKey){renderPicker(el);return;}
  const w=PLAN.find(p=>p.key===activeWorkoutKey);
  if(!w||w.type==='rest'){renderPicker(el);return;}
  renderDay(el,w);
}

function renderPicker(el){
  const rec=getRecommendation();
  const today=getTodayStr();
  const workouts=PLAN.filter(p=>p.type!=='rest');
  const recPlan=PLAN.find(p=>p.key===rec.key);
  const recColor=TYPE_COLORS[recPlan?.type]||'#3498db';
  let html=`
    <div class="rec-card" onclick="selectWorkout('${rec.key}')" style="border-color:${recColor}">
      <div class="rec-icon">💡</div>
      <div class="rec-body">
        <div class="rec-title" style="color:${recColor}">${recPlan?.emoji} ${recPlan?.title}</div>
        <div class="rec-reason">${rec.reason}</div>
      </div>
      <div class="rec-arrow" style="color:${recColor}">›</div>
    </div>
    <div class="picker-heading">Alle Einheiten</div>`;
  workouts.forEach(w=>{
    const isRec=w.key===rec.key;
    const color=TYPE_COLORS[w.type];
    const lastDate=getLastDoneDate(w.key);
    const ds=daysSince(lastDate);
    const todayDone=localStorage.getItem('tp_done_'+today)===w.key;
    const {done,total}=getWorkoutProgress(w.key);
    const pct=total>0?Math.round(done/total*100):0;
    let badgeText,badgeColor;
    if(todayDone){badgeText=pct===100?'✓ Fertig':pct+'%';badgeColor=pct===100?'#27ae60':'#e67e22';}
    else if(lastDate){badgeText=ds===0?'heute':ds===1?'gestern':`vor ${ds}d`;badgeColor=ds>6?'#e74c3c':color;}
    else{badgeText='noch nie';badgeColor='#aaa';}
    html+=`
    <div class="picker-card${isRec?' recommended':''}" onclick="selectWorkout('${w.key}')" style="${isRec?`border-color:${color};background:${color}0d`:''}">
      <div class="picker-dot" style="background:${color}22">${w.emoji}</div>
      <div class="picker-info">
        <div class="picker-name" style="${isRec?`color:${color}`:''}}">${w.title}</div>
        <div class="picker-sub">${w.subtitle}</div>
      </div>
      <span class="picker-badge" style="color:${badgeColor}">${badgeText}</span>
      <span class="picker-arr">›</span>
    </div>`;
  });
  el.innerHTML=html;
}

function renderOverview(el){
  const today=getTodayStr();
  el.innerHTML='<div class="week-overview active" id="wo"></div>';
  const ov=document.getElementById('wo');
  PLAN.filter(p=>p.type!=='rest').forEach(w=>{
    const {done,total}=getWorkoutProgress(w.key);
    const pct=total>0?Math.round(done/total*100):-1;
    const lastDate=getLastDoneDate(w.key);
    const ds=daysSince(lastDate);
    const todayDone=localStorage.getItem('tp_done_'+today)===w.key;
    const bc=pct===100?'#1e8449':pct>0?'#e67e22':'#bbb';
    const bb=pct===100?'#e8f8f0':pct>0?'#fff3e0':'#f4f5f7';
    const bt=todayDone?(pct===100?'✓ Heute':pct+'%'):lastDate?(ds===0?'heute':ds===1?'gestern':`vor ${ds}d`):'–';
    const card=document.createElement('div');
    card.className='week-card';
    card.onclick=()=>selectWorkout(w.key);
    card.innerHTML=`
      <div class="week-card-dot" style="background:${TYPE_COLORS[w.type]}22">${w.emoji}</div>
      <div class="week-card-info">
        <h3 style="color:${TYPE_COLORS[w.type]}">${w.title}</h3>
        <p>${w.subtitle} · ${w.exercises.length} Übungen</p>
      </div>
      <span class="week-card-badge" style="color:${bc};background:${bb}">${bt}</span>`;
    ov.appendChild(card);
  });
}

function renderDay(el,w){
  maybeStartSession(w.key);
  // Laufende Pausenuhr aus dem Inhalt herausretten, bevor er neu aufgebaut
  // wird – sonst verschwindet der Timer beim Re-Render.
  const _tb=document.getElementById('timerBar'); if(_tb) document.body.appendChild(_tb);
  const {done,total}=getWorkoutProgress(w.key);
  const pct=total>0?Math.round(done/total*100):0;
  const color=TYPE_COLORS[w.type];
  const C=2*Math.PI*20;
  const kcal=done===total&&total>0?calcKcal(w.type,w.key):0;
  const bw=getBodyWeight();
  el.innerHTML=`
    ${!bw?`<div class="bw-hint"><span>⚖️ Gewicht eingeben für Kalorien-Schätzung</span><button onclick="promptBodyWeight()">Eingeben</button></div>`:''}
    <div class="day-header" style="background:${color}">
      <div class="day-header-left">
        <button onclick="goBackToPicker()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:6px">‹ Zurück</button>
        <h2>${w.title}</h2>
        <p>${w.subtitle} · ${w.exercises.length} Übungen · ${total} Sätze</p>
        ${kcal>0?`<div class="kcal-badge">🔥 ~${kcal} kcal verbrannt</div>`:''}
      </div>
      <div class="progress-ring">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="20" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>
          <circle cx="26" cy="26" r="20" fill="none" stroke="white" stroke-width="4"
            stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" stroke-linecap="round"
            style="transition:stroke-dashoffset 0.5s"/>
        </svg>
        <div class="pct">${pct}%</div>
      </div>
    </div>
    <div class="warmup-card wu-open" id="warmupCard">
      <div class="warmup-hdr" onclick="document.getElementById('warmupCard').classList.toggle('wu-open')">
        <div class="warmup-icon">🏃</div>
        <div class="warmup-title">Aufwärmen (10–15 Min.)</div>
        <div class="warmup-badge">ausstehend</div>
        <div class="warmup-chev">▼</div>
      </div>
      <div class="warmup-body"></div>
    </div>
    <div id="exerciseList"></div>`;
  renderWarmupCard(w.key);

}

function promptBodyWeight(){
  document.getElementById('modalTitle').textContent='⚖️ Körpergewicht';
  document.getElementById('modalBody').innerHTML=`
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Einmalig gespeichert, für Kalorien-Schätzung.</p>
    <div class="bw-input-row">
      <input class="bw-input" type="number" id="bwInput" placeholder="z.B. 75" min="30" max="200" step="0.5" value="${getBodyWeight()||''}">
      <span style="display:flex;align-items:center;font-size:16px;font-weight:700">kg</span>
    </div>
    <button class="modal-btn success" style="margin-top:12px" onclick="saveBW()">✓ Speichern</button>
    <button class="modal-btn cancel" onclick="closeModal()">Abbrechen</button>`;
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>{const i=document.getElementById('bwInput');if(i)i.focus();},200);
}
function saveBW(){
  const v=parseFloat(document.getElementById('bwInput')?.value||'0');
  if(v<30||v>300){showToast('Bitte gültiges Gewicht eingeben.');return;}
  setBodyWeight(v);closeModal();showToast('⚖️ Gewicht gespeichert: '+v+' kg');render();
}

function renderExercises(w,color){
  const list=document.getElementById('exerciseList');
  if(!list)return;
  list.innerHTML='';
  w.exercises.forEach((ex,idx)=>{
    if(ex.superset&&idx>0&&!w.exercises[idx-1].superset){
      const d=document.createElement('div');d.className='superset-divider';
      d.innerHTML='<span>SUPERSATZ</span>';list.appendChild(d);
    }
    if(ex.floorUp){
      const d=document.createElement('div');d.className='floor-divider floor-up';
      d.innerHTML='<span>▲ Wechsel nach oben — Freihanteln &amp; Kabelzug</span>';list.appendChild(d);
    }
    if(ex.floorDown){
      const d=document.createElement('div');d.className='floor-divider floor-down';
      d.innerHTML='<span>▼ Wechsel nach unten — Maschinen</span>';list.appendChild(d);
    }
    const skipped=isExSkipped(w.key,ex.id);
    const allDone=!skipped&&Array.from({length:ex.sets},(_,s)=>isDone(w.key,ex.id,s)).every(Boolean);
    const card=document.createElement('div');
    card.className='ex-card'+(ex.superset?' superset':'')+(allDone?' done-all':'')+(skipped?' skipped':'')+(openEx.has(ex.id)?' open':'');
    card.id='card_'+ex.id;
    const nc=skipped?'#bbb':ex.superset?'#27ae60':color;
    card.innerHTML=`<div class="ex-header">
      <div class="ex-nr" style="background:${nc}">${idx+1}</div>
      <div class="ex-info" onclick="toggleEx('${ex.id}')">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-meta">${ex.sets} × ${ex.reps}${ex.rest?' · '+fmtRest(ex.rest)+' Pause':''}</div>
      </div>
      <div class="ex-status">${allDone?'✅':skipped?'⏭':''}</div>
      <button class="skip-ex-btn ${skipped?'active':'inactive'}" onclick="toggleExSkip('${w.key}','${ex.id}')">${skipped?'↩ Zurück':'⏭ Skip'}</button>
      <div class="ex-chevron" onclick="toggleEx('${ex.id}')">▼</div>
    </div>`;
    if(skipped){
      const lbl=document.createElement('div');lbl.className='skipped-label';
      lbl.textContent='Übung ausgelassen';card.appendChild(lbl);
    } else {
      const sd=document.createElement('div');sd.className='ex-sets';sd.id='exSets_'+ex.id;
      sd.innerHTML='<div class="sets-header"><span>Satz</span><span>Kg</span><span>Wdh.</span><span>✓</span></div>';
      for(let s=0;s<ex.sets;s++){
        const done=isDone(w.key,ex.id,s);
        const row=document.createElement('div');
        row.className='set-row'+(done?' done':'');row.id=`row_${ex.id}_${s}`;
        row.innerHTML=`
          <div class="set-nr">${s+1}</div>
          <input class="set-input" type="number" inputmode="decimal" placeholder="–" value="${loadSetWithFallback(w.key,ex.id,ex.name,s,'kg')}" min="0" step="0.5"
            oninput="saveSet('${w.key}','${ex.id}',${s},'kg',this.value)">
          <input class="set-input" type="number" inputmode="numeric" placeholder="–" value="${loadSetWithFallback(w.key,ex.id,ex.name,s,'reps')}" min="0"
            oninput="saveSet('${w.key}','${ex.id}',${s},'reps',this.value)">
          <button class="set-done-btn${done?' done':''}" id="doneBtn_${ex.id}_${s}" onclick="toggleSetDone('${w.key}','${ex.id}',${s},${ex.rest||0})">${done?'✓':''}</button>`;
        sd.appendChild(row);
      }
      if(ex.notes){const n=document.createElement('div');n.className='notes-text';n.textContent='💡 '+ex.notes;sd.appendChild(n);}
      card.appendChild(sd);
    }
    list.appendChild(card);
  });
}

function fmtRest(s){return s>=60?Math.floor(s/60)+' min'+(s%60?' '+s%60+'s':''):s+'s';}

// ─── INTERACTIONS ────────────────────────────────────────────
function toggleEx(id){
  if(openEx.has(id))openEx.delete(id);else openEx.add(id);
  const c=document.getElementById('card_'+id);
  if(c)c.classList.toggle('open',openEx.has(id));
}

function toggleSetDone(dk,ei,si,restSecs){
  const was=isDone(dk,ei,si);
  saveSet(dk,ei,si,'done',was?'0':'1');
  if(!was){
    const kg=loadSet(dk,ei,si,'kg');
    const reps=loadSet(dk,ei,si,'reps');
    saveSetToHistory(dk,ei,si,kg,reps);
  }
  // Trainingstag verlässlich festhalten (bei jedem Abhaken/Zurücknehmen).
  syncSessionRecord(dk);
  const {done,total}=getWorkoutProgress(dk);
  const justFinished=!was&&done===total&&total>0;
  if(justFinished){
    const w=PLAN.find(p=>p.key===dk);
    const kcal=calcKcal(w?.type||'push',dk);
    if(kcal>0){ try{localStorage.setItem('tp_kcal_'+getTodayStr(),kcal);}catch(e){} }
  }
  if(!was&&restSecs>0) startTimer(restSecs,ei);
  // Sofortige, gezielte Aktualisierung – kein kompletter Neuaufbau.
  updateSetRowUI(dk,ei,si);
  updateExCardUI(dk,ei);
  updateProgress();
  updateFab();
  try{ renderTabs(); }catch(e){}
  if(justFinished){
    // Beim Abschluss einmal komplett rendern (Kalorien-Badge im Kopf etc.).
    render();
    placeTimerBar();
    const w=PLAN.find(p=>p.key===dk);
    const kcal=calcKcal(w?.type||'push',dk);
    if(kcal>0) showToast('🎉 Fertig! 🔥 ~'+kcal+' kcal verbrannt');
    else showToast('🎉 Training abgeschlossen!');
  }
}

function toggleExSkip(dk,ei){
  const was=isExSkipped(dk,ei);
  setExSkipped(dk,ei,!was);
  // Auch reines Überspringen zählt als Trainingstag – sonst wurde eine
  // Einheit, die nur per Skip abgeschlossen wurde, nie gespeichert.
  syncSessionRecord(dk);
  showToast(was?'↩ Übung wiederhergestellt':'⏭ Übung übersprungen');
  // Nur die Übungsliste neu aufbauen (Werte kommen aus dem Speicher,
  // bleiben also erhalten); Timer vorher retten.
  const w=PLAN.find(p=>p.key===dk);
  if(w){
    const tb=document.getElementById('timerBar'); if(tb) document.body.appendChild(tb);
    renderExercises(w,TYPE_COLORS[w.type]);
    placeTimerBar();
  }
  updateProgress();
  updateFab();
  try{ renderTabs(); }catch(e){}
}

function updateProgress(){
  if(!activeWorkoutKey)return;
  const {done,total}=getWorkoutProgress(activeWorkoutKey);
  const pct=total>0?Math.round(done/total*100):0;
  const C=2*Math.PI*20;
  const p=document.querySelector('.pct'),c=document.querySelector('.progress-ring circle:last-child');
  if(p)p.textContent=pct+'%';
  if(c)c.setAttribute('stroke-dashoffset',C*(1-pct/100));
}

// ── Gezielte, sofortige UI-Updates (ohne die ganze Seite neu zu bauen) ──
// Dadurch färbt sich alles unmittelbar grün, Eingabefelder behalten Fokus
// & Werte, und die laufende Pausenuhr bleibt erhalten.
function updateSetRowUI(dk,ei,si){
  const done=isDone(dk,ei,si);
  const row=document.getElementById('row_'+ei+'_'+si);
  if(row)row.classList.toggle('done',done);
  const btn=document.getElementById('doneBtn_'+ei+'_'+si);
  if(btn){btn.classList.toggle('done',done);btn.textContent=done?'✓':'';}
}
function updateExCardUI(dk,ei){
  const card=document.getElementById('card_'+ei);
  if(!card)return;
  const w=PLAN.find(p=>p.key===dk);if(!w)return;
  const ex=w.exercises.find(e=>e.id===ei);if(!ex)return;
  const skipped=isExSkipped(dk,ei);
  const allDone=!skipped&&Array.from({length:ex.sets},(_,s)=>isDone(dk,ei,s)).every(Boolean);
  card.classList.toggle('done-all',allDone);
  const st=card.querySelector('.ex-status');
  if(st)st.textContent=allDone?'✅':skipped?'⏭':'';
}

// ─── TIMER ───────────────────────────────────────────────────
function startTimer(s,exId){
  stopTimer();
  timerRem=s;timerTotal=s;timerExId=exId||null;
  placeTimerBar();
  updateTimerDisplay();
  timerInterval=setInterval(()=>{timerRem--;updateTimerDisplay();if(timerRem<=0){stopTimer();showToast('⏱ Pause vorbei – nächster Satz!');}},1000);
}
function stopTimer(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  timerExId=null;
  const b=document.getElementById('timerBar');
  if(b){b.classList.remove('active');document.body.appendChild(b);}
}
function placeTimerBar(){
  const b=document.getElementById('timerBar');if(!b)return;
  if(!timerInterval){document.body.appendChild(b);b.classList.remove('active');return;}
  const target=timerExId?document.querySelector(`#exSets_${timerExId}`):null;
  if(target){target.appendChild(b);}
  else{const el=document.getElementById('exerciseList');if(el)el.appendChild(b);else document.body.appendChild(b);}
  b.classList.add('active');
}
function updateTimerDisplay(){
  const d=document.getElementById('timerDisplay'),f=document.getElementById('timerFill');
  if(d)d.textContent=Math.floor(timerRem/60)+':'+String(timerRem%60).padStart(2,'0');
  if(f)f.style.width=(timerRem/timerTotal*100)+'%';
}

  if(!activeWorkoutKey||viewMode==='overview'){fab.style.display='none';return;}

function confirmReset(){
  closeModal();
  const key=activeWorkoutKey;if(!key)return;
  const w=PLAN.find(p=>p.key===key);if(!w)return;
  w.exercises.forEach(ex=>{
    for(let s=0;s<ex.sets;s++) ['kg','reps','done'].forEach(f=>{try{localStorage.removeItem(sk(w.key,ex.id,s,f));}catch(e){}});
    try{localStorage.removeItem(SK+w.key+'_'+ex.id+'_skip');}catch(e){}
  });
  // Bewusstes Zurücksetzen entfernt auch den heutigen Trainingseintrag.
  try{if(localStorage.getItem('tp_done_'+getTodayStr())===w.key)localStorage.removeItem('tp_done_'+getTodayStr());}catch(e){}
  openEx.clear();render();showToast('Training zurückgesetzt.');
}

function confirmResetAll(){
  closeModal();
  try{
    Object.keys(localStorage).filter(k=>
      k.startsWith(SK)||k.startsWith('tp_done_')||k.startsWith('tp_hist_')||
      k.startsWith('tp_kcal_')||k.startsWith('tp_sess_')||k.startsWith('tp_wu_')||
      k==='tp_bodyweight'
    ).forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  activeWorkoutKey=null;openEx.clear();render();showToast('Alle Daten gelöscht.');
}

function closeModal(e){
  if(!e||e.target===document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('open');
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── REPORT ──────────────────────────────────────────────────
function showReport(){closeModal();renderReport();document.getElementById('reportOverlay').classList.add('open');}
function hideReport(){document.getElementById('reportOverlay').classList.remove('open');}

function getAllSessions(){
  try{
    return Object.keys(localStorage)
      .filter(k=>k.startsWith('tp_done_'))
      .map(k=>{const date=k.replace('tp_done_','');const dayKey=localStorage.getItem(k);const day=PLAN.find(p=>p.key===dayKey);return day?{date,dayKey,type:day.type,title:day.title,emoji:day.emoji}:null;})
      .filter(Boolean)
      .sort((a,b)=>a.date.localeCompare(b.date));
  }catch(e){return [];}
}
function getWeekMonday(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
  return mon.toISOString().slice(0,10);
}
function calcStreak(sessions){
  if(!sessions.length)return 0;
  const dates=new Set(sessions.map(s=>s.date));
  let streak=0,d=new Date();
  while(true){const str=d.toISOString().slice(0,10);if(dates.has(str)){streak++;d.setDate(d.getDate()-1);}else break;}
  return streak;
}

function renderReport(){
  const sessions=getAllSessions();
  const el=document.getElementById('reportContent');
  const now=new Date();
  const weeks={};
  for(let w=7;w>=0;w--){
    const d=new Date(now);d.setDate(now.getDate()-w*7);
    const wk=getWeekMonday(d.toISOString().slice(0,10));
    if(!weeks[wk])weeks[wk]={push:0,pull:0,legs:0,total:0};
  }
  sessions.forEach(s=>{const wk=getWeekMonday(s.date);if(weeks[wk]){weeks[wk][s.type]=(weeks[wk][s.type]||0)+1;weeks[wk].total++;}});
  const weekKeys=Object.keys(weeks).sort();
  const maxSess=Math.max(1,...weekKeys.map(wk=>weeks[wk].total));
  const thisWeek=getWeekMonday(getTodayStr());
  const sessThisWeek=sessions.filter(s=>getWeekMonday(s.date)===thisWeek).length;
  const totalSessions=sessions.length;
  const streakDays=calcStreak(sessions);
  const avgPerWeek=totalSessions>0?Math.round(totalSessions/Math.max(1,weekKeys.length)*10)/10:0;
  const totalKcal=sessions.reduce((s,sess)=>s+getKcal(sess.date),0);
  const typeCnt={push:0,pull:0,legs:0};
  sessions.forEach(s=>{if(typeCnt[s.type]!==undefined)typeCnt[s.type]++;});
  const totalTyped=typeCnt.push+typeCnt.pull+typeCnt.legs;

  // Exercise progression
  const progData={};
  try{
    Object.keys(localStorage).forEach(k=>{
      if(!k.startsWith('tp_hist_')||!k.endsWith('_kg'))return;
      const parts=k.split('_');if(parts.length<7)return;
      const date=parts[2],dk=parts[3],eid=parts[4];
      const exKey=dk+'_'+eid;
      const kg=parseFloat(localStorage.getItem(k));
      if(isNaN(kg)||kg<=0)return;
      if(!progData[exKey])progData[exKey]={};
      if(!progData[exKey][date]||kg>progData[exKey][date])progData[exKey][date]=kg;
    });
  }catch(e){}
  _progArrays={};
  Object.keys(progData).forEach(exKey=>{
    _progArrays[exKey]=Object.entries(progData[exKey]).map(([date,kg])=>({date,kg})).sort((a,b)=>a.date.localeCompare(b.date));
  });
  const progKeys=Object.keys(_progArrays).filter(k=>_progArrays[k].length>0);

  let html='';

  // Summary
  html+=`<div class="report-section">
    <h3>Zusammenfassung</h3>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val">${totalSessions}</div><div class="stat-lbl">Einheiten gesamt</div></div>
      <div class="stat-box"><div class="stat-val">${sessThisWeek}</div><div class="stat-lbl">Diese Woche</div></div>
      <div class="stat-box"><div class="stat-val">${streakDays}</div><div class="stat-lbl">Tage Streak 🔥</div></div>
      <div class="stat-box"><div class="stat-val">${avgPerWeek}</div><div class="stat-lbl">⌀ pro Woche</div></div>
    </div>
    ${totalKcal>0?`<div style="text-align:center;margin-top:10px;font-size:13px;color:var(--muted)">🔥 Geschätzte Kalorien: <strong>${totalKcal.toLocaleString('de-DE')} kcal</strong></div>`:''}
  </div>`;

  // Weekly chart
  html+=`<div class="report-section">
    <h3>Aktivität (letzte 8 Wochen)</h3>
    <div class="week-chart-wrap">`;
  weekKeys.forEach(wk=>{
    const wd=weeks[wk];
    const isThis=wk===thisWeek;
    const mon=new Date(wk+'T12:00:00');
    const lbl=mon.toLocaleDateString('de-DE',{day:'numeric',month:'numeric'});
    const pH=Math.round((wd.push/maxSess)*70);
    const puH=Math.round((wd.pull/maxSess)*70);
    const lH=Math.round((wd.legs/maxSess)*70);
    html+=`<div class="wk-col">
      <div class="wk-bars">
        ${lH>0?`<div class="wk-bar" style="background:var(--legs);height:${lH}px"></div>`:''}
        ${puH>0?`<div class="wk-bar" style="background:var(--pull);height:${puH}px"></div>`:''}
        ${pH>0?`<div class="wk-bar" style="background:var(--push);height:${pH}px"></div>`:''}
        ${wd.total===0?`<div class="wk-bar" style="background:#eee;height:4px"></div>`:''}
      </div>
      <div class="wk-lbl" style="${isThis?'font-weight:800;color:var(--text)':''}">${lbl}</div>
    </div>`;
  });
  html+=`</div>
    <div class="chart-legend">
      <span style="color:var(--push)">🔴 Push: ${typeCnt.push}</span>
      <span style="color:var(--pull)">🟢 Pull: ${typeCnt.pull}</span>
      <span style="color:var(--legs)">🟣 Beine: ${typeCnt.legs}</span>
    </div>
  </div>`;

  // Distribution
  if(totalTyped>0){
    html+=`<div class="report-section"><h3>Trainingsverteilung</h3>`;
    [{label:'Push',cnt:typeCnt.push,color:'var(--push)'},{label:'Pull',cnt:typeCnt.pull,color:'var(--pull)'},{label:'Beine',cnt:typeCnt.legs,color:'var(--legs)'}].forEach(t=>{
      const pct=Math.round(t.cnt/totalTyped*100);
      html+=`<div class="muscle-row">
        <div class="muscle-label">${t.label}</div>
        <div class="muscle-bar-bg"><div class="muscle-bar-fill" style="width:${pct}%;background:${t.color}"></div></div>
        <div class="muscle-count">${t.cnt}x</div>
      </div>`;
    });
    html+=`</div>`;
  }

  // Progression
  if(progKeys.length>0){
    const exNames={};
    PLAN.forEach(w=>w.exercises.forEach(ex=>{exNames[w.key+'_'+ex.id]=ex.name;}));
    html+=`<div class="report-section">
      <h3>Gewichtsprogression</h3>
      <select class="ex-select" id="progSelect" onchange="updateProgChart(this.value)">
        ${progKeys.map(k=>`<option value="${k}">${exNames[k]||k}</option>`).join('')}
      </select>
      <div id="progChart"></div>
    </div>`;
  }

  // Recent sessions
  const recent=sessions.slice(-15).reverse();
  html+=`<div class="report-section"><h3>Letzte Einheiten</h3>`;
  if(!recent.length){
    html+=`<div class="no-data-hint"><div class="nd-icon">📭</div><p>Noch keine abgeschlossenen Einheiten.<br>Starte dein erstes Training!</p></div>`;
  } else {
    recent.forEach(s=>{
      const d=new Date(s.date+'T12:00:00');
      const dateStr=d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
      html+=`<div class="session-item">
        <div class="session-dot" style="background:${TYPE_COLORS[s.type]}22">${s.emoji}</div>
        <div class="session-info">
          <div class="si-name" style="color:${TYPE_COLORS[s.type]}">${s.title}</div>
          <div class="si-date">${dateStr}</div>
        </div>
      </div>`;
    });
  }
  html+=`</div>`;
  el.innerHTML=html;
  if(progKeys.length>0) updateProgChart(progKeys[0]);
}

function updateProgChart(exKey){
  const el=document.getElementById('progChart');if(!el)return;
  const arr=_progArrays[exKey];
  if(!arr||!arr.length){el.innerHTML='<div class="no-data-hint"><p>Noch keine Daten</p></div>';return;}
  const recent=arr.slice(-10);
  el.innerHTML=`<table class="prog-table">
    <tr><th>Datum</th><th>Max kg</th></tr>
    ${recent.map(e=>{const d=new Date(e.date+'T12:00:00');return `<tr><td>${d.toLocaleDateString('de-DE',{day:'numeric',month:'numeric'})}</td><td>${e.kg} kg</td></tr>`;}).join('')}
  </table>`;
}

// ─── DEBUG ───────────────────────────────────────────────────
function exportData(){
  closeModal();
  try{
    const data={};
    Object.keys(localStorage).filter(k=>k.startsWith('tp_')).forEach(k=>{data[k]=localStorage.getItem(k);});
    const json=JSON.stringify(data);
    document.getElementById('modalTitle').textContent='📤 Daten exportieren';
    document.getElementById('modalBody').innerHTML=`
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px">Diesen Text kopieren und auf dem anderen Gerät importieren:</p>
      <textarea id="exportText" style="width:100%;height:120px;font-size:10px;font-family:monospace;border:1px solid var(--border);border-radius:8px;padding:8px;resize:none" readonly>${json}</textarea>
      <button class="modal-btn primary" style="margin-top:8px" onclick="navigator.clipboard.writeText(document.getElementById('exportText').value).then(()=>showToast('✓ Kopiert!'))">📋 Kopieren</button>
      <button class="modal-btn cancel" onclick="closeModal()">Schließen</button>`;
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(()=>{const t=document.getElementById('exportText');if(t){t.focus();t.select();}},100);
  }catch(e){showToast('Fehler: '+e.message);}
}

function importData(){
  closeModal();
  document.getElementById('modalTitle').textContent='📥 Daten importieren';
  document.getElementById('modalBody').innerHTML=`
    <p style="font-size:12px;color:var(--muted);margin-bottom:8px">Exportierten Text hier einfügen:</p>
    <textarea id="importText" style="width:100%;height:120px;font-size:10px;font-family:monospace;border:1.5px solid #3498db;border-radius:8px;padding:8px;resize:none" placeholder="Hier den kopierten Text einfügen…"></textarea>
    <button class="modal-btn success" style="margin-top:8px" onclick="doImport()">✓ Importieren</button>
    <button class="modal-btn cancel" onclick="closeModal()">Abbrechen</button>`;
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>{const t=document.getElementById('importText');if(t)t.focus();},100);
}

function doImport(){
  try{
    const txt=document.getElementById('importText')?.value?.trim();
    if(!txt){showToast('Kein Text eingegeben.');return;}
    const data=JSON.parse(txt);
    let count=0;
    Object.entries(data).forEach(([k,v])=>{if(k.startsWith('tp_')){localStorage.setItem(k,v);count++;}});
    closeModal();
    render();
    showToast('✅ '+count+' Einträge importiert!');
  }catch(e){showToast('Fehler beim Import: '+e.message);}
}

function showDebug(){
  closeModal();
  try{
    const keys=Object.keys(localStorage).filter(k=>k.startsWith('tp_')).sort();
    if(!keys.length){
      document.getElementById('modalTitle').textContent='🔍 Gespeicherte Daten';
      document.getElementById('modalBody').innerHTML='<p style="color:var(--muted);font-size:13px">Keine tp_-Daten gefunden.</p><button class="modal-btn cancel" onclick="closeModal()">Schließen</button>';
      document.getElementById('modalOverlay').classList.add('open');
      return;
    }
    const sample=keys.slice(0,40);
    document.getElementById('modalTitle').textContent='🔍 Gespeicherte Daten ('+keys.length+' Einträge)';
    document.getElementById('modalBody').innerHTML=`
      <div style="font-size:10px;font-family:monospace;background:#f4f5f7;padding:10px;border-radius:8px;max-height:300px;overflow-y:auto;margin-bottom:10px">
        ${sample.map(k=>`<div><b>${k}</b> = ${localStorage.getItem(k)}</div>`).join('')}
        ${keys.length>40?`<div style="color:#999">… und ${keys.length-40} weitere</div>`:''}
      </div>
      <button class="modal-btn cancel" onclick="closeModal()">Schließen</button>`;
    document.getElementById('modalOverlay').classList.add('open');
  }catch(e){showToast('Fehler: '+e.message);}
}

// ─── MIGRATION v2 → v3 ───────────────────────────────────────
(function migrateV2(){
  try{
    if(localStorage.getItem('tp_migrated_v2v3')==='1') return;
    let count=0;
    Object.keys(localStorage).forEach(k=>{
      if(k.startsWith('tp_v2_')){
        const newKey='tp_v3_'+k.slice('tp_v2_'.length);
        if(!localStorage.getItem(newKey)){
          localStorage.setItem(newKey,localStorage.getItem(k));
          count++;
        }
      }
    });
    localStorage.setItem('tp_migrated_v2v3','1');
    if(count>0) console.log('Migration: '+count+' Einträge von v2 → v3 kopiert.');
  }catch(e){}
})();

document.getElementById('topbarDate').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
render();
</script>
